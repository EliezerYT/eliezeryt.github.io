name: Generate Ely image manifest

on:
  push:
    branches: [main]
    paths:
      - 'assets/images/ely/**'
      - '.github/workflows/generate-ely-image-manifest.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-ely-image-manifest-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate and commit manifest
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            echo "Manifest attempt $attempt"
            git fetch origin main
            git reset --hard origin/main

            python - <<'PY'
          import json
          import os

          root = "assets/images/ely"
          extensions = {".png", ".jpg", ".jpeg", ".webp", ".gif", ".avif", ".bmp", ".svg"}
          images = []

          for current_root, dirs, files in os.walk(root):
              dirs.sort()
              for filename in sorted(files):
                  if os.path.splitext(filename)[1].lower() in extensions:
                      full_path = os.path.join(current_root, filename)
                      images.append(os.path.relpath(full_path, root).replace(os.sep, "/"))

          with open(os.path.join(root, "manifest.json"), "w", encoding="utf-8") as file:
              json.dump(images, file, ensure_ascii=False, indent=2)
              file.write("\\n")
          PY

            git add assets/images/ely/manifest.json
            if git diff --cached --quiet; then
              echo "Manifest is already up to date."
              exit 0
            fi

            git commit -m "Update Ely image manifest"
            if git push origin HEAD:main; then
              echo "Manifest pushed successfully."
              exit 0
            fi

            echo "Push rejected because main changed. Retrying with the latest main..."
            git reset --hard HEAD~1
            sleep $((attempt * 2))
          done

          echo "Could not update the manifest after 5 attempts."
          exit 1
